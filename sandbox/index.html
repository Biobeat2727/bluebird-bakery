<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bluebird - frame animation sandbox</title>
<style>
  :root{
    --bg:#12151b; --panel:#1a1f27; --line:#2b3340; --ink:#e8edf5;
    --muted:#98a4b6; --accent:#4ea3ff; --stage:#fdf7ec; --h:320px;
  }
  *{box-sizing:border-box}
  body{margin:0;font:14px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
       background:var(--bg);color:var(--ink);display:grid;grid-template-columns:1fr 340px;height:100vh}
  @media (max-width:900px){body{grid-template-columns:1fr;height:auto}}

  /* ---- stage ---- */
  #stage{position:relative;display:grid;place-items:center;background:var(--stage);overflow:hidden}
  #stage.dark{--stage:#141c26}
  #stage.grid{background-image:linear-gradient(rgba(0,0,0,.06) 1px,transparent 1px),
              linear-gradient(90deg,rgba(0,0,0,.06) 1px,transparent 1px);background-size:32px 32px}
  #birdWrap{position:relative;line-height:0}
  #bird{height:var(--h);width:auto;display:block}
  #onion{position:absolute;left:0;top:0;pointer-events:none;opacity:.26;display:none}
  #onion img{position:absolute;left:0;top:0;height:var(--h);width:auto}
  #stage.onion #onion{display:block}
  /* perch line sits where the current frame's feet make contact */
  #perchLine{position:absolute;left:-160px;right:-160px;height:2px;background:#ff4d4d;opacity:.55;display:none}
  #stage.perch #perchLine{display:block}
  #anchorDot{position:absolute;width:9px;height:9px;margin:-5px 0 0 -5px;border-radius:50%;
             background:#ff4d4d;box-shadow:0 0 0 2px #fff;display:none}
  #stage.anchor #anchorDot{display:block}
  #hud{position:absolute;top:14px;left:14px;white-space:pre;
       font:12px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;
       color:#3c4657;background:rgba(0,0,0,.05);padding:8px 10px;border-radius:8px}
  #stage.dark #hud{color:#9fb0c6}

  /* ---- panel ---- */
  #panel{background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;padding:18px}
  h1{font-size:13px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0 0 14px}
  h2{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);
     margin:22px 0 10px;padding-top:14px;border-top:1px solid var(--line)}
  button{font:inherit;background:#232b36;color:var(--ink);border:1px solid var(--line);
         border-radius:7px;padding:8px 11px;cursor:pointer}
  button:hover{background:#2c3542;border-color:#3d4859}
  button.on{background:var(--accent);border-color:var(--accent);color:#08121e;font-weight:600}
  .row{display:flex;flex-wrap:wrap;gap:7px}
  .slider{display:grid;grid-template-columns:88px 1fr 46px;align-items:center;gap:9px;margin:7px 0}
  .slider label{font-size:12px;color:var(--muted)}
  .slider output{font:12px ui-monospace,Menlo,monospace;color:var(--ink);text-align:right}
  input[type=range]{width:100%;accent-color:var(--accent)}
  .toggles{display:grid;grid-template-columns:1fr 1fr;gap:7px}
  #status{font:12px ui-monospace,Menlo,monospace;color:var(--muted);margin-top:10px;min-height:2.6em}
  textarea{width:100%;height:150px;background:#0f1319;color:#cfe0f5;border:1px solid var(--line);
           border-radius:7px;padding:9px;font:11px/1.5 ui-monospace,Menlo,monospace;resize:vertical}
</style>
</head>
<body>
  <div id="stage" class="perch">
    <div id="hud">loading frames...</div>
    <div id="birdWrap">
      <div id="onion"></div>
      <img id="bird" alt="Bluebird">
      <div id="perchLine"></div>
      <div id="anchorDot"></div>
    </div>
  </div>

  <div id="panel">
    <h1>Bluebird &middot; frame sandbox</h1>

    <h2 style="border:0;padding:0;margin-top:0">Sequences</h2>
    <div class="row" id="seqRow">
      <button data-seq="rest">Rest</button>
      <button data-seq="blink">Blink</button>
      <button data-seq="takeoff">Takeoff</button>
      <button data-seq="flight" id="flightBtn">Flight loop</button>
      <button data-seq="landing">Landing</button>
      <button data-seq="full">Full sequence</button>
      <button data-seq="turn">Turn round</button>
    </div>
    <div id="status">&mdash;</div>

    <h2>Frame timing (ms)</h2>
    <div id="timingSliders"></div>

    <h2>Display</h2>
    <div class="slider">
      <label for="sizeR">Height</label>
      <input type="range" id="sizeR" min="60" max="520" value="320">
      <output id="sizeV">320</output>
    </div>
    <div class="toggles">
      <button data-tog="perch" class="on">Perch line</button>
      <button data-tog="anchor">Anchor</button>
      <button data-tog="onion">Onion skin</button>
      <button data-tog="grid">Grid</button>
      <button data-tog="dark">Dark bg</button>
      <button id="rmBtn">Reduced motion</button>
    </div>

    <h2>Step through</h2>
    <div class="row" id="frameBtns"></div>

    <h2>Export tuned timing</h2>
    <div class="row"><button id="exportBtn">Copy JSON</button></div>
    <textarea id="exportOut" readonly></textarea>
  </div>

<script type="module">
import { loadFrames, DEFAULT_TIMING, SEQUENCES, REST_FRAME, buildFullSequence, FRAME_IDS, OPTIONAL_FRAME_IDS }
  from './src/bluebirdFrames.js';
import { BluebirdAnimator } from './src/BluebirdAnimator.js';

const stage = document.getElementById('stage');
const birdEl = document.getElementById('bird');
const hud = document.getElementById('hud');
const statusEl = document.getElementById('status');
const perchLine = document.getElementById('perchLine');
const anchorDot = document.getElementById('anchorDot');

const timing = { ...DEFAULT_TIMING };
let frames, anim, flying = false, landRequested = false, mirrored = false;

const systemReduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

function say(msg){ statusEl.textContent = msg; }

/* Keeps the perch line and anchor dot pinned to the registration data, so the
   sandbox shows exactly what the motion system will later align to. */
function updateOverlays(frameId){
  const { canvas, anchor, frames: fr } = frames.registration;
  const h = birdEl.getBoundingClientRect().height || 320;
  const k = h / canvas.height;
  anchorDot.style.left = (anchor.x * k) + 'px';
  anchorDot.style.top  = (anchor.y * k) + 'px';
  const foot = fr[frameId] ? fr[frameId].footOffsetY : null;
  if (foot == null){
    perchLine.style.visibility = 'hidden';
  } else {
    perchLine.style.visibility = 'visible';
    perchLine.style.top = ((anchor.y + foot) * k) + 'px';
  }
  hud.textContent = 'frame  ' + frameId + '\n'
    + 'foot   ' + (foot == null ? 'airborne' : foot.toFixed(0) + 'px below anchor');
}

async function init(){
  frames = await loadFrames('./frames/');
  anim = new BluebirdAnimator(birdEl, { frames, timing, reducedMotion: systemReduced });
  anim.onFrame = updateOverlays;
  anim.setFrame(REST_FRAME);

  // onion skin: every frame stacked, to eyeball registration drift
  document.getElementById('onion').innerHTML =
    FRAME_IDS.map(function(id){ return '<img src="' + frames.srcOf(id) + '" alt="">'; }).join('');

  const fb = document.getElementById('frameBtns');
  const stepIds = FRAME_IDS.concat(OPTIONAL_FRAME_IDS.filter(function(id){ return frames.images[id]; }));
  fb.innerHTML = stepIds.map(function(id){
    return '<button data-frame="' + id + '">' + id + '</button>';
  }).join('');
  fb.onclick = function(e){
    const id = e.target.dataset.frame;
    if (!id) return;
    anim.stop(); flying = false; syncFlightBtn();
    anim.setFrame(id);
    say('held on "' + id + '"');
  };

  buildTimingSliders();
  say(systemReduced ? 'prefers-reduced-motion is ON - bird stays perched.' : 'ready');
}

function buildTimingSliders(){
  const box = document.getElementById('timingSliders');
  box.innerHTML = Object.keys(timing).map(function(k){
    return '<div class="slider">'
      + '<label for="t_' + k + '">' + k + '</label>'
      + '<input type="range" id="t_' + k + '" data-k="' + k + '" min="40" max="500" step="10" value="' + timing[k] + '">'
      + '<output id="o_' + k + '">' + timing[k] + '</output>'
      + '</div>';
  }).join('');
  box.oninput = function(e){
    const k = e.target.dataset.k;
    if (!k) return;
    timing[k] = Number(e.target.value);          // live object -> applies mid-playback
    document.getElementById('o_' + k).textContent = timing[k];
  };
}

/* ---- sequence driving ----
   The animator's requestStop() only affects a sequence that is looping *right
   now*. A land request that arrives mid-takeoff would therefore be dropped, and
   the bird would flap forever. So intent lives here, in the caller: we re-read
   landRequested at every sequence boundary. The real controller uses the same
   rule for its target perch. */
async function runFlight(){
  flying = true; landRequested = false; syncFlightBtn();

  say('takeoff...');
  await anim.play(SEQUENCES.takeoff);

  if (!landRequested){
    say('flying - loop runs until you stop it');
    const looping = anim.play(SEQUENCES.flightLoop, { loop: true });
    // A request that arrived during takeoff must still be honoured.
    if (landRequested) anim.requestStop();
    await looping;
  }

  say('landing...');
  await anim.play(SEQUENCES.landing);
  flying = false; landRequested = false; syncFlightBtn();
  say('perched');
}

function syncFlightBtn(){
  const b = document.getElementById('flightBtn');
  b.classList.toggle('on', flying);
  b.textContent = flying ? 'Land' : 'Flight loop';
}

document.getElementById('seqRow').onclick = async function(e){
  const seq = e.target.dataset.seq;
  if (!seq) return;

  if (seq === 'flight'){
    if (flying){
      say('finishing this wingbeat, then landing...');
      landRequested = true;
      anim.requestStop();
    } else runFlight();
    return;
  }

  flying = false; syncFlightBtn();
  if (seq === 'rest'){ anim.stop(); anim.setFrame(REST_FRAME); say('perched'); return; }
  if (seq === 'blink'){ say('blink'); await anim.play(SEQUENCES.blink); say('perched'); return; }
  if (seq === 'takeoff'){ say('takeoff'); await anim.play(SEQUENCES.takeoff); say('airborne (held)'); return; }
  if (seq === 'landing'){ say('landing'); await anim.play(SEQUENCES.landing); say('perched'); return; }
  if (seq === 'turn'){
    if (!frames.hasTurn){ say('no turn frames - run tools/build_turn_frames.py'); return; }
    say('turning');
    await anim.play(SEQUENCES.turnOut);
    // Mirror on the head-on frame, about the feet, exactly as the site does.
    const front = frames.registration.frames['turn-front'];
    mirrored = !mirrored;
    birdEl.style.transformOrigin = (front.pivotX / frames.registration.canvas.width * 100) + '% 50%';
    birdEl.style.transform = mirrored ? 'scaleX(-1)' : '';
    await anim.play(SEQUENCES.turnIn.concat([[REST_FRAME, 'perch']]));
    say('perched, facing ' + (mirrored ? 'left' : 'right'));
    return;
  }
  if (seq === 'full'){
    say('full sequence: takeoff -> 4 wingbeats + glide -> landing');
    await anim.play(buildFullSequence(4, 3));
    say('perched');
  }
};

/* ---- display toggles ---- */
document.querySelector('.toggles').onclick = function(e){
  const t = e.target.dataset.tog;
  if (!t) return;
  stage.classList.toggle(t);
  e.target.classList.toggle('on', stage.classList.contains(t));
};

document.getElementById('rmBtn').onclick = function(e){
  anim.reducedMotion = !anim.reducedMotion;
  e.target.classList.toggle('on', anim.reducedMotion);
  if (anim.reducedMotion){ anim.stop(); flying = false; syncFlightBtn(); anim.setFrame(REST_FRAME); }
  say(anim.reducedMotion
    ? 'reduced motion: sequences resolve instantly, bird holds its pose'
    : 'reduced motion off');
};

const sizeR = document.getElementById('sizeR');
sizeR.oninput = function(){
  document.documentElement.style.setProperty('--h', sizeR.value + 'px');
  document.getElementById('sizeV').textContent = sizeR.value;
  if (anim && anim.currentFrame) updateOverlays(anim.currentFrame);
};

document.getElementById('exportBtn').onclick = function(){
  const json = JSON.stringify(timing, null, 2);
  document.getElementById('exportOut').value = json;
  if (navigator.clipboard) navigator.clipboard.writeText(json);
  say('timing copied - paste into DEFAULT_TIMING');
};

init().catch(function(err){
  hud.textContent = 'load failed: ' + err.message;
  say(String(err));
});
</script>
</body>
</html>
